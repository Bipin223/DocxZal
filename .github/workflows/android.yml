name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "favicon.svg"
      - "intro.js"
      - "native.js"
      - "fonts/**"
      - "vendor/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install JS dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: npm run sync

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk docxzal-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: docxzal-debug-apk
          path: docxzal-debug.apk
          if-no-files-found: error

      - name: Publish rolling debug APK (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest docxzal-debug.apk --clobber
            gh release edit android-latest --notes "Auto-built from main at ${{ github.sha }}"
          else
            gh release create android-latest docxzal-debug.apk \
              --title "Docxzal Android — latest debug build" \
              --notes "Auto-built from main at ${{ github.sha }}" \
              --prerelease
          fi

      - name: Publish tagged APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" docxzal-debug.apk --clobber
          else
            gh release create "${GITHUB_REF_NAME}" docxzal-debug.apk \
              --title "Docxzal ${GITHUB_REF_NAME} — debug APK" \
              --notes "Auto-built from ${GITHUB_REF_NAME}" \
              --verify-tag
          fi
